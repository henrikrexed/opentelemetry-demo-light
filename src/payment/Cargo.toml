[package]
name = "payment"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "payment"
path = "src/main.rs"

[dependencies]
tonic = "0.14.8"
tonic-prost = "0.14.8"
prost = "0.14.4"
tokio = { version = "~1.54.1", features = ["full"] }
uuid = { version = "=1.29.2", features = ["v4"] }

# OTel
opentelemetry = { version = "0.33", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gRPC health check
tonic-health = "0.14.8"

[build-dependencies]
tonic-prost-build = "0.14.8"

plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.10.1'
}

group = 'io.opentelemetry.demo'
version = '1.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Security pin: force transitive com.google.guava:guava (pulled in via gRPC) to a patched
    // release. Cart has no direct guava usage. CVE-2026-102554 (HIGH) fixed in 33.7.2 (ISI-6883).
    constraints {
        implementation('com.google.guava:guava:33.8.0-jre') {
            because 'CVE-2026-102554 — transitive via gRPC'
        }
    }

    // gRPC
    implementation 'io.grpc:grpc-netty-shaded:1.85.1'
    implementation 'io.grpc:grpc-protobuf:1.85.1'
    implementation 'io.grpc:grpc-stub:1.85.1'
    implementation 'io.grpc:grpc-services:1.85.1'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    // Redis/Valkey client
    implementation 'redis.clients:jedis:8.0.2'

    // JSON serialization for cart storage
    implementation 'com.google.code.gson:gson:2.15.0'

    // OTel API for custom metrics only (no manual instrumentation in business logic)
    implementation 'io.opentelemetry:opentelemetry-api:1.67.0'

    // Required for protobuf generated code
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.36.2'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.85.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

application {
    mainClass = 'io.opentelemetry.demo.cart.CartApplication'
}

jar {
    manifest {
        attributes 'Main-Class': 'io.opentelemetry.demo.cart.CartApplication'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Fat JAR for Docker
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'io.opentelemetry.demo.cart.CartApplication'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  product-catalog:
    name: Product Catalog (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/product-catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Generate protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          mkdir -p genproto/oteldemo
          protoc --proto_path=../../proto \
            --go_out=genproto/oteldemo --go_opt=paths=source_relative --go_opt=Mdemo.proto=. \
            --go-grpc_out=genproto/oteldemo --go-grpc_opt=paths=source_relative --go-grpc_opt=Mdemo.proto=. \
            ../../proto/demo.proto

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race ./...

      - name: Docker build
        run: docker build -t product-catalog:ci .

      - name: Trivy CVE gate (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: product-catalog:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  cart:
    name: Cart (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build & Test
        run: gradle build --no-daemon

      - name: Docker build
        run: docker build -t cart:ci .

      - name: Trivy CVE gate (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: cart:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  payment:
    name: Payment (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/payment
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/payment

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Docker build
        run: docker build -t payment:ci .

      - name: Trivy CVE gate (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: payment:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  checkout:
    name: Checkout (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Generate protobuf
        run: |
          python -m grpc_tools.protoc -I../../proto \
            --python_out=. --grpc_python_out=. \
            ../../proto/demo.proto

      - name: Test
        run: pytest -v test_checkout.py

      - name: Docker build
        run: docker build -t checkout:ci .

      - name: Debug image python inventory
        run: |
          echo "== pip freeze in image =="
          docker run --rm --entrypoint python checkout:ci -m pip list --format=freeze | grep -Ei 'msgpack|urllib3|setuptools|^pip ' || true
          echo "== all dist-info dirs in image =="
          docker run --rm --entrypoint sh checkout:ci -c 'find / -xdev -type d -name "*.dist-info" 2>/dev/null | sort' || true

      - name: Trivy JSON debug
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: checkout:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-debug.json
          trivyignores: .trivyignore

      - name: Dump trivy JSON python findings
        run: |
          jq '.Results[] | select(.Type == "python-pkg") | {Target, Vulns: [.Vulnerabilities[]? | {PkgName, InstalledVersion, FixedVersion, PkgPath, Layer}]}' trivy-debug.json || true
          jq '.Results[] | select((.Vulnerabilities // []) | length > 0) | {Target, Type, count: (.Vulnerabilities | length)}' trivy-debug.json || true

      - name: Trivy CVE gate (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: checkout:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t frontend:ci .

      - name: Trivy CVE gate (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  load-generator:
    name: Load Generator (k6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/load-generator
    steps:
      - uses: actions/checkout@v4

      - name: Validate k6 script syntax
        run: |
          echo "k6 script validation happens during Docker build (custom extension required)"

      - name: Docker build (OTel)
        run: docker build -t load-generator:ci .

      - name: Docker build (Dynatrace)
        run: docker build -f Dockerfile.dynatrace -t load-generator-dynatrace:ci .

      - name: Trivy CVE gate — OTel (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: load-generator:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy CVE gate — Dynatrace (fail on new fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0  # ed142fd0673e
        with:
          image-ref: load-generator-dynatrace:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
